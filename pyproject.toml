[project]
name = "talk-shop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piotr Gnyś", email = "pgnys@swps.edu.pl" }
]
requires-python = ">=3.13"
dependencies = [
  "lark>=1.2.2",
  "sqlalchemy>=2.0.0",
]

[project.scripts]
talk-shop = "talk_shop:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "coverage",
  "pre-commit",
  "ipython"
]
